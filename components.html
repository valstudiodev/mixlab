<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="icon" type="image/svg+xml" href="public/favicon.ico" />
   <title>Components-page</title>
</head>

<body>
   <div class="components">
      <div class="components__container">

         <div class="components__item">
            <button class="icon-menu">
               <span></span>
            </button>
         </div>

         <div class="components__item">
            <a href="#" type="button" class="button">Learn More</a>
         </div>

         <div class="components__item">
            <a href="#" type="button" class="button button--small">Try Mixlab</a>
         </div>

         <div class="components__item">
            <article class="item-review">
               <figure class="item-review__inner">
                  <img src="/src/assets/img/img/review-img-01.webp" alt="image avatar" class="item-review__logo">
                  <figcaption class="item-review__content">
                     <blockquote>“Tootsie just received her Mixlab order and she’s so excited for it! Within two hours
                        of ordering it got delivered to
                        the house and its like she knew it was at the door. She absolutely hates taking her medicine but
                        she truly loves her
                        Mixlab box because it’s so informative, quick, easy to order but especially because includes a
                        new toy each time! Thank
                        you Mixlab for always taking care of her! She can’t wait to place her next order now!”
                     </blockquote>
                     <span class="item-review__author item-review__author--icon-instagram">Tootsie, CA</span>
                  </figcaption>
               </figure>
            </article>
         </div>

         <div class="components__item">

         </div>

      </div>
   </div>

   <script type="module" src="/src/main.js"></script>
</body>

</html>
